name: Unity CI and Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  unity-tests:
    name: Unity EditMode and PlayMode tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out (including Git LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Unity-6000.3.29f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Unity-6000.3.29f1-

      - name: Verify Unity activation secrets are present
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$UNITY_LICENSE" ]] || missing+=(UNITY_LICENSE)
          [[ -n "$UNITY_EMAIL" ]] || missing+=(UNITY_EMAIL)
          [[ -n "$UNITY_PASSWORD" ]] || missing+=(UNITY_PASSWORD)
          if ((${#missing[@]} > 0)); then
            printf 'Missing required repository Actions secret(s): %s' "${missing[*]}" >&2
            echo >&2
            exit 1
          fi
          echo "Unity activation secrets are present; values were not logged."

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.29f1
          cliVersion: v0.1.77
          projectPath: .
          testMode: all
          coverageEnabled: false
          artifactsPath: artifacts/test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Phase 0 Unity tests

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14

  windows-build:
    name: Build and package Windows x64 (Mono)
    needs: unity-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out (including Git LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Unity-6000.3.29f1-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Unity-6000.3.29f1-Windows-

      - name: Build Windows x64
        id: build
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.77
          unityVersion: 6000.3.29f1
          targetPlatform: StandaloneWindows64
          buildName: OpenRoad
          buildsPath: build
          buildMethod: OpenRoad.Editor.SpikeProjectBuilder.BuildForGameCI
          manualExit: true
          allowDirtyBuild: true
          versioning: Custom
          version: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}+{1}', github.ref_name, github.run_number) || format('0.1.0+{0}', github.run_number) }}

      - name: Package the player and requested docs
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          exe_path="$(find build -type f -iname 'OpenRoad.exe' -print -quit)"
          if [[ -z "$exe_path" ]]; then
            echo "OpenRoad.exe was not found under build/" >&2
            find build -maxdepth 5 -type f -print >&2 || true
            exit 1
          fi
          player_dir="$(dirname "$exe_path")"
          mkdir -p package/docs smoke-build dist
          cp -a "$player_dir/." package/
          cp -a "$player_dir/." smoke-build/
          cp README.md package/README.md
          cp docs/BENCHMARKING.md package/BENCHMARKING.md
          cp docs/ASSET_LICENSES.md package/ASSET_LICENSES.md
          (cd package && zip -qr "../dist/OpenRoad-Windows-${RUN_NUMBER}.zip" .)

      - name: Upload standalone player for smoke test
        uses: actions/upload-artifact@v4
        with:
          name: openroad-windows-smoke-build
          path: smoke-build
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: openroad-windows-${{ github.run_number }}
          path: dist/OpenRoad-Windows-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 14

  windows-smoke-test:
    name: Windows player smoke launch
    needs: windows-build
    runs-on: windows-latest
    steps:
      - name: Download Windows player
        uses: actions/download-artifact@v4
        with:
          name: openroad-windows-smoke-build
          path: smoke-build

      - name: Launch the player headlessly and verify scene initialization
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'smoke-build/OpenRoad.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Recurse smoke-build
            throw "OpenRoad.exe missing from downloaded player artifact"
          }
          $log = Join-Path $PWD 'smoke.log'
          $process = Start-Process -FilePath $exe -ArgumentList @('-smoke', '-batchmode', '-nographics', '-logFile', $log) -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw "Smoke player did not exit within 120 seconds"
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw "Smoke player exited with code $($process.ExitCode)"
          }
          if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern 'OPENROAD_SMOKE_OK' -Quiet)) {
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw "Smoke success marker was not written"
          }
          Get-Content $log -Tail 80

  github-release:
    name: Publish verified tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-build, windows-smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          lfs: false

      - name: Download tested Windows zip
        uses: actions/download-artifact@v4
        with:
          name: openroad-windows-${{ github.run_number }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: gh release create "$GITHUB_REF_NAME" "dist/OpenRoad-Windows-${RUN_NUMBER}.zip" --verify-tag --title "OPEN ROAD $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
